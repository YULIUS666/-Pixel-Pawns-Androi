<script>

let n=3,size=3,L=gen(3),mode='local';
let b,pid,moved,turn,sel,over,winLine,winner,anim=null,scores={X:0,O:0};

  bd.style.gridTemplateColumns=`repeat(${n},minmax(0,1fr))`;bd.style.gridTemplateRows=`repeat(${n},minmax(0,1fr))`;bd.style.setProperty('--ins',INS[n]);bd.innerHTML='';
  b.forEach((v,i)=>{const d=document.createElement('button');d.className='c'+((Math.floor(i/n)+i)%2?' d':'')+(sel===i?' sel':'')+(winLine.includes(i)?' win':'');d.innerHTML=v?`<div class="pc">${IC[v]}</div>`:' ';d.onclick=()=>tap(i);bd.appendChild(d);});
  if(A&&fr&&b[A.to]){const cell=bd.children[A.to],pc=cell.firstChild,tr=cell.getBoundingClientRect(),dx=fr.left-tr.left,dy=fr.top-tr.top;cell.style.zIndex=3;const an=pc.animate([{transform:`translate(${dx}px,${dy}px) scale(.9)`,opacity:0},{transform:'translate(0,0) scale(1)',opacity:1}],{duration:180,easing:'ease-out'});an.onfinish=()=>cell.style.zIndex='';}
  for(const p of ['X','O']){const e=$('p'+p);e.classList.toggle('on',!over&&turn===p);e.innerHTML=`${IC[p]}<div class="nm"><b>${nm(p)}${mode==='online'&&p===role?' '+t('you'):''}</b>${status(p)}${pwHtml(p)}</div>`;}
}
function tap(i){
  if(paused||over||(mode==='online'&&role!==turn)||(mode==='bot'&&turn==='O'))return;
  if(b[i]===turn){sel=i;return render()}
  if(arm==='s'&&sel!==null&&b[i]&&b[i]!==turn)return doSwap(sel,i);
  if(sel!==null&&!b[i])doMove(sel,i);
}
function doMove(f,t){arm=null;sfx('mv');anim={from:f,to:t};lastMv=anim;b[t]=turn;pid[t]=pid[f];moved[turn][pid[t]]=1;b[f]=null;pid[f]=null;sel=null;end()}
function end(){
  const w=moved[turn].every(Boolean)&&L.find(l=>l.every(k=>b[k]===turn));
  if(w){over=true;winLine=w;winner=turn;scores[turn]++;sfx('win');render();shake();finale();award(turn);push();return}
  if(ex){ex=false}else turn=turn==='X'?'O':'X';render();push();bot();
}
function shake(){const a=$('app');a.classList.add('shake');if(navigator.vibrate)try{navigator.vibrate([200,80,200,80,400])}catch(e){}setTimeout(()=>a.classList.remove('shake'),1800)}
function wins(bd,pd,mv,t,f,to){const nb=bd.slice(),np=pd.slice(),nmv=mv[t].slice();nb[to]=t;np[to]=np[f];nmv[np[to]]=1;nb[f]=null;return nmv.every(Boolean)&&L.some(l=>l.every(k=>nb[k]===t))}
function oppWins(bd,pd,mv,op){const em=[];bd.forEach((v,i)=>{if(!v)em.push(i)});for(let i=0;i<bd.length;i++)if(bd[i]===op)for(const e of em)if(wins(bd,pd,mv,op,i,e))return true;return false}
function bot(){if(paused||mode!=='bot'||turn!=='O'||over)return;botT=setTimeout(()=>{if(paused||mode!=='bot'||turn!=='O'||over)return;
  const me='O',op='X',em=[];b.forEach((v,i)=>{if(!v)em.push(i)});let best=null,bs=-1e9;
  for(let f=0;f<b.length;f++)if(b[f]===me)for(const t of em){let s=Math.random()*(diff==='easy'?60:diff==='hard'?1:3);
   if(wins(b,pid,moved,me,f,t))s+=1e5;
   else{const nb=b.slice(),np=pid.slice(),nmv={X:moved.X,O:moved.O.slice()};nb[t]=me;np[t]=np[f];nmv.O[np[t]]=1;nb[f]=null;
    if(!(diff==='easy'&&Math.random()<.6)&&oppWins(nb,np,nmv,op))s-=5e4;
    if(!moved.O[pid[f]])s+=6;
    let bl=0;for(const l of L){let mi=0,th=0;for(const k of l){if(nb[k]===me)mi++;else if(nb[k]===op)th++}if(!th)bl=Math.max(bl,mi)}s+=bl*4;if(diff==='hard'){let ob=0;for(const l of L){let mi=0,th=0;for(const k of l){if(nb[k]===op)mi++;else if(nb[k]===me)th++}if(!th)ob=Math.max(ob,mi)}s+=ob*3}
    if(!moved.O[pid[f]]&&Math.random()<.2)s+=15;
    if(Math.random()<.08)s+=12;}
   if(s>bs){bs=s;best=[f,t]}}
  if(best){if(diff!=='easy'&&!pw.O.e&&!ex&&Math.random()<.18){pw.O.e=1;ex=true;say2('xtra')}else if(Math.random()<.2)say2('taunt');doMove(best[0],best[1])}},800)}
function showFreezePanel(){
  const f=$('fx');
  let panel=$('freeze-panel');
  if(!panel){panel=document.createElement('div');panel.id='freeze-panel';f.appendChild(panel)}
  panel.innerHTML=`<div id="freeze-card"><div id="freeze-word">FREEZE</div><div id="freeze-sub">${t('paused')}</div><button class="r b" id="resume-freeze">${t('resume')}</button></div>`;
  $('resume-freeze').onclick=resumeGame;
}
function freezeGame(){
  if(over||paused||!powerSettings.freeze)return;
  paused=true;
  clearTimeout(botT);botT=null;
  document.body.classList.add('is-paused');
  $('app').classList.remove('shake');
  $('app').classList.add('freeze-shake');
  setTimeout(()=>$('app').classList.remove('freeze-shake'),450);
  if(ac&&ac.state==='running')ac.suspend().catch(()=>{});
  showFreezePanel();
  const btn=$('freeze');if(btn)btn.textContent=t('resume');
}
function resumeGame(){
  if(!paused)return;
  paused=false;
  document.body.classList.remove('is-paused');
  const panel=$('freeze-panel');if(panel)panel.remove();
  const btn=$('freeze');if(btn)btn.textContent=t('freeze');
  if(musicOn&&ac&&ac.state==='suspended')ac.resume().catch(()=>{});
  if(mode==='bot'&&turn==='O'&&!over)bot();
}
$('freeze').onclick=()=>paused?resumeGame():freezeGame();
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('game').hidden){if(paused)resumeGame();else freezeGame()}});
let ac=null,mg=null,nb_=null,tm=null,musicOn=true,nt=0,st=0;
const F=x=>440*Math.pow(2,(x-69)/12);
const LD=[72,0,75,0,79,0,75,0,77,0,80,0,77,0,75,0,74,0,77,0,79,0,77,0,75,0,72,0,67,0,0,0];
const RT=[48,53,55,48];
function tone(f,t,d,ty,v){const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d)}
function hat(t){const s=ac.createBufferSource(),g=ac.createGain();s.buffer=nb_;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+.04);s.connect(g);g.connect(mg);s.start(t);s.stop(t+.05)}
function sched(){while(nt<ac.currentTime+.3){const s=st%32,l=LD[s];if(l)tone(F(l),nt,.14,'square',.07);const r=RT[Math.floor(s/8)];if(s%2===0)tone(F(r+(s%4===2?12:0)),nt,.17,'triangle',.18);else if(s%3===0)hat(nt);nt+=.14;st++}}
function startAudio(){if(!musicOn||paused)return;try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=.8;mg.connect(ac.destination);nb_=ac.createBuffer(1,22050,22050);const data=nb_.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.exp(-i/22050)};if(ac.state==='suspended')ac.resume().catch(()=>{});if(!tm)tm=setInterval(sched,140)}catch(e){}}
function sfx(k){if(!ac||!musicOn)return;const t=ac.currentTime;if(k==='mv'){tone(660,t,.08,'square',.12);tone(880,t+.07,.1,'square',.12)}else{[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,t+i*.08,.1,'triangle',.12))}}
document.addEventListener('pointerdown',startAudio);
$('mu').onclick=()=>{musicOn=!musicOn;$('mu').textContent=(musicOn?'🔊 ':'🔇 ')+t('mu');if(musicOn)startAudio();else{clearInterval(tm);tm=null}};
function push(inc=true){if(mode!=='online'||!room||!role)return;if(inc)seq++;const mv=lastMv;lastMv=null;room.emit('st',{seq,n,b,pid,moved,turn,over,winLine,winner,scores,mv,pw,ex}).catch(()=>{})}
function applySt(s){if(!s||s.seq<seq)return;const nn=+s.n;if(!(nn>=3&&nn<=6)||!Array.isArray(s.b)||s.b.length!==nn*nn||!s.moved||!s.scores)return;seq=s.seq;n=nn;size=nn;L=gen(nn);b=[...s.b];pid=[...s.pid]||Array(nn*nn).fill(null);moved=s.moved;turn=s.turn;over=s.over;winLine=s.winLine||[];winner=s.winner;scores=s.scores;pw=s.pw||{X:{e:0,s:0},O:{e:0,s:0}};ex=!!s.ex;lastMv=s.mv||null;render();}
function say(t){$('olmsg').textContent=t}
function calcRole(ps){const pl=ps.filter(p=>p.presence&&p.presence.pid).sort((a,c)=>(a.presence.t-c.presence.t)||(a.presence.pid<c.presence.pid?-1:1));nPl=Math.min(pl.length,2);const i=pl.findIndex(p=>p.isMe);role=i>=0?['X','O'][i]:null}
async function leaveRoom(){if(room){try{await room.leave()}catch(e){}room=null}role=null;nPl=0}
async function goOnline(code){code=(code||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,12);if(!code){say(t('needCode'));return}
  try{const rm=window.claude?await claude.use('room'):null;if(!rm){say(t('needLogin'));return}
  await leaveRoom();room=await rm.join('xo-'+code);mode='online';scores={X:0,O:0};init();seq=0;
  room.onPeers(ch=>{calcRole(ch.peers);if(ch.joined.some(p=>!p.isMe)&&role)push(false)});
  room.on('st',m=>{if(m.isMe)return;applySt(m.data)});
  await room.presence({pid:myId,t:Date.now()});showGame()}catch(e){say(t('fail')+(e&&e.code?' ('+e.code+')':''))}}
function showGame(){$('menu').hidden=true;$('game').hidden=false;render()}
function showMenu(){if(paused)resumeGame();clearTimeout(botT);leaveRoom();mode='local';$('game').hidden=true;$('menu').hidden=false}
function start(m){mode=m;scores={X:0,O:0};init();showGame();}
$('logo').innerHTML=IC.X+IC.O;
$('sizes').innerHTML=[3,4,5,6].map(k=>`<button class="r sz${k===3?' on':''}" data-n="${k}">${k}×${k}</button>`).join('');
document.querySelectorAll('.sz').forEach(el=>el.onclick=()=>{size=+el.dataset.n;document.querySelectorAll('.sz').forEach(x=>x.classList.toggle('on',x===el))});
$('mBot').onclick=()=>start('bot');
$('mLoc').onclick=()=>start('local');
$('mOn').onclick=()=>{$('ol').hidden=!$('ol').hidden};
$('go').onclick=()=>goOnline($('code').value);
$('back').onclick=showMenu;
$('rs').onclick=()=>{if(mode==='online'&&!role)return;init();if(mode==='online'){seq++;push(false)}};
(async()=>{try{if(!window.claude)return;const d=await claude.use('downloads');if(d){$('dl').hidden=false;$('dl').onclick=()=>d.save({filename:'pixel-pawns.html',data:new Blob([SRC],{type:'text/html'})})}}catch(e){}})();
(async()=>{try{if(!window.claude)return;const u=await claude.use('user');if(!u)return;const m=await u.me();const t=[m.name,m.email].filter(Boolean).join(' • ');if(t)$('who').textContent='👤 '+t}catch(e){}})();
function applyLang(){const D=document.documentElement;D.lang=lang;D.dir=lang==='ar'?'rtl':'ltr';D.style.setProperty('--dir',D.dir);const q=(id,k)=>{$(id).textContent=t(k)};document.querySelectorAll('.lb2')[0]&&(document.querySelectorAll('.lb2')[0].textContent=t('botLv'));document.querySelectorAll('.lb2')[1]&&(document.querySelectorAll('.lb2')[1].textContent=t('skinLb'));renderPowerOptions();}
$('lang').onclick=()=>{lang=lang==='ar'?'en':'ar';applyLang()};
(function(){const W=200,H=300;let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;let r='';
for(let i=0;i<70;i++){const z=rnd()<.2?2:1;r+=`<rect class="st${i%3}" x="${Math.floor(rnd()*W)}" y="${Math.floor(rnd()*H*.65)}" width="${z}" height="${z}" fill="#fff"/>`}
for(let dy=-7;dy<=7;dy++){const hw=Math.round(Math.sqrt(49-dy*dy));r+=`<rect x="${150-hw}" y="${45+dy}" width="${2*hw+1}" height="1" fill="#ffe9a8"/>`}
r+='<rect x="146" y="42" width="3" height="2" fill="#e0c27a"/><rect x="152" y="48" width="2" height="2" fill="#e0c27a"/><rect x="148" y="51" width="2" height="1" fill="#e0c27a"/>';
[[225,'#2f2058',.05,7],[255,'#1a1233',.09,5]].forEach(([base,col,f,ph])=>{for(let x=0;x<W;x+=8){const y=Math.round(base-14*Math.abs(Math.sin(x*f+ph))-8*Math.sin(x*f*2.3));r+=`<rect x="${x}" y="${Math.max(0,y)}" width="8" height="${Math.max(1,Math.round((H-y)/4.5))}" fill="${col}"/>`}});
$('bg').innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges">${r}</svg>`})();
const SK=[{lv:1,nm:[['الأحمر','الأسود'],['RED','BLACK']],X:PAL.X,O:PAL.O},{lv:2,nm:[['الوردي','السماوي'],['PINK','CYAN']],X:{k:'#3a0030',h:'#ff9cf0',m:'#ff2bd6',s:'#8a0a72'},O:{k:'#00203a',h:'#9ceaff',m:'#18c8ff',s:'#0a6a8a'}},{lv:3,nm:[['الذهبي','الفضي'],['GOLD','SILVER']],X:{k:'#3a2a00',h:'#fff2a8',m:'#ffc61a',s:'#a87400'},O:{k:'#1a1a1a',h:'#f4f4f8',m:'#c8c8d0',s:'#6e6e7a'}},{lv:4,nm:[['الجليدي','البنفسجي'],['ICE','VIOLET']],X:{k:'#07303a',h:'#d9fbff',m:'#6fe3f5',s:'#2a8fa8'},O:{k:'#1a0a3a',h:'#d4b8ff',m:'#8a5cff',s:'#4a2a9e'}}];
let SV={xp:0,w:0,g:0,st:0,sk:0};try{Object.assign(SV,JSON.parse(localStorage.getItem('pp_sv')||'{}'))}catch(e){}
const lvOf=xp=>Math.floor(Math.sqrt(xp/25))+1;
function save(){try{localStorage.setItem('pp_sv',JSON.stringify(SV))}catch(e){}}
skin=(SV.sk>=0&&SV.sk<SK.length&&lvOf(SV.xp)>=SK[SV.sk].lv)?SV.sk:0;
function applySkin(){PAL.X=SK[skin].X;PAL.O=SK[skin].O;IC={X:icon('X'),O:icon('O')};$('logo').innerHTML=IC.X+IC.O}
function setSkin(i){skin=i;SV.sk=i;save();applySkin();render();menuX()}
function miniIcon(i){const k=PAL.X;PAL.X=SK[i].X;const s=icon('X');PAL.X=k;return s}
function toast(m){const e=$('toast');e.textContent=m;e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{e.hidden=true},2600)}
function say2(k){const e=$('bub'),a=t('xt');e.textContent=k==='xtra'?t('xtra'):a[Math.floor(Math.random()*a.length)];e.hidden=false;clearTimeout(say2.h);say2.h=setTimeout(()=>{e.hidden=true},2200)}
function award(w){let gain=0,win=false;if(mode==='bot'){win=w==='X';gain=win?({easy:20,norm:30,hard:50}[diff]):8}else if(mode==='online'&&role){win=w===role;gain=win?35:10}else return;const l0=lvOf(SV.xp);SV.xp+=gain;SV.g++;if(win)SV.w++;if(l0!==lvOf(SV.xp))toast('✨ '+t('lvl')+' '+lvOf(SV.xp));save();menuX()}
function menuX(){const lv=lvOf(SV.xp),lo=25*(lv-1)*(lv-1),hi=25*lv*lv,ti=t('titles')[Math.min(lv-1,7)];
  $('prof').innerHTML=`<div>⭐ ${t('lvl')} ${lv} • ${ti}</div><div class="xpb"><i style="width:${Math.round((SV.xp-lo)/(hi-lo)*100)}%"></i></div><div>${t('wins')} ${SV.w}/${SV.g} • 🔥 ${t('streak')} ${SV.st}</div>`;
  $('lbD').textContent=t('botLv');$('lbS').textContent=t('skinLb');

  $('skins').innerHTML=SK.map((s,i)=>`<button class="r sk${skin===i?' on':''}" data-s="${i}">${lv>=s.lv?miniIcon(i):'🔒'+s.lv}</button>`).join('');
  document.querySelectorAll('.df').forEach(el=>el.onclick=()=>{diff=el.dataset.d;menuX()});
  document.querySelectorAll('.sk').forEach(el=>el.onclick=()=>{const i=+el.dataset.s;if(lv>=SK[i].lv)setSkin(i);else toast(t('lock')+' '+SK[i].lv)})}
function pwHtml(p){const o=pw[p],can=!over&&p===turn&&!(mode==='bot'&&p==='O')&&(mode!=='online'||p===role);const showFreeze=powerSettings.freeze&&can&&!(o.e||ex);const showSwap=powerSettings.swap&&can&&!o.s;return `<div class="pw">${showFreeze?`<button data-pw="e" data-p="${p}"${o.e||ex?' disabled':''}>❄</button>`:''}${showSwap?`<button data-pw="s" data-p="${p}"${o.s?' disabled':''}>↔</button>`:''}</div>`;}
document.addEventListener('click',e=>{const x=e.target.closest&&e.target.closest('[data-pw]');if(!x||x.disabled)return;usePower(x.dataset.p,x.dataset.pw)});
function usePower(p,k){if(paused||over||p!==turn)return;if(k==='e'){if(!powerSettings.freeze||pw[p].e||ex)return;pw[p].e=1;ex=true;sfx('win');toast('⚡ +1');render();push(false)}else{if(!powerSettings.swap||pw[p].s)return;arm=arm==='s'?null:'s';toast(arm?'↔ '+(lang==='ar'?'اختر هدفاً للتبديل':'Choose a target to swap'):'↔ OFF');render();push(false)}}
function doSwap(f,i){sfx('mv');const me=turn,a=pid[f];[b[f],b[i]]=[b[i],b[f]];[pid[f],pid[i]]=[pid[i],pid[f]];moved[me][a]=1;pw[me].s=1;arm=null;sel=null;anim={from:f,to:i};lastMv=anim;end()}
function puff(x,y){const f=$('fx');for(let k=0;k<8;k++){const d=document.createElement('i');d.className='pf';const a=k*Math.PI/4;d.style.cssText=`left:${x}px;top:${y}px;--dx:${Math.cos(a)*34}px;--dy:${Math.sin(a)*34}px`;f.appendChild(d);setTimeout(()=>d.remove(),500)}}
function finale(){const f=$('fx'),fl=document.createElement('div');fl.className='fl';f.appendChild(fl);setTimeout(()=>fl.remove(),400);const c=['#ff5a5a','#ffd84f','#4fd1ff','#7dff7a','#ff2bd6','#ffd5b0'];for(let i=0;i<18;i++){const d=document.createElement('div');d.className='cf';d.style.left=`${Math.random()*100}%`;d.style.background=c[i%c.length];d.style.animationDuration=`${1.4+Math.random()*1.8}s`;d.style.setProperty('--rot',Math.random()*360+'deg');f.appendChild(d);setTimeout(()=>d.remove(),2200)}}
applySkin();
init();applyLang();
